<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Статьи расходов — Личные финансы</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Golos+Text:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
    <header>
        <div class="logo">Личные финансы</div>
    </header>

    <div class="tabs">
        <a href="/Categories.html" class="tab">Категории</a>
        <a href="/ExpenseItems.html" class="tab active">Статьи расходов</a>
        <a href="/Transactions.html" class="tab">Транзакции</a>
    </div>

    <div class="page">
        <div class="card">
            <div class="form-row">
                <div class="field">
                    <label>Название</label>
                    <input id="item-name" type="text" placeholder="Например: Обед" style="width:200px" />
                </div>
                <div class="field">
                    <label>Категория</label>
                    <select id="item-category" style="width:180px">
                        <option disabled selected value="">— выберите —</option>
                    </select>
                </div>
                <div class="field">
                    <label>Активна</label>
                    <select id="item-active" style="width:100px">
                        <option value="true">Да</option>
                        <option value="false">Нет</option>
                    </select>
                </div>
                <button class="btn btn-primary" type="button" id="item-add">+ Добавить</button>
            </div>
        </div>

        <div id="item-msg"></div>

        <div class="card" style="padding:0;overflow:hidden">
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Название</th>
                            <th>Категория</th>
                            <th>Статус</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="item-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/expenseItems.js"></script>
</body>
</html>
